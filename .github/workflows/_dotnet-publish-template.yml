name: '[Reusable] Publish new release'

on:
  workflow_call:
    inputs:
      filename:
        type: string

jobs:
  reusable_workflow_job:
    runs-on:  ubuntu-latest
    steps:

    - name: "Download build"
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.filename }}

    - uses: vimtor/action-zip@v1.3
      with:
        files: H.Core/
        dest: ${{ inputs.filename }}.zip

    - name: Set short SHA
      id: vars
      run: echo "sha_short=`echo ${{ github.sha }} | cut -c1-8`" >> $GITHUB_OUTPUT

    # The release is created first, the asset uploaded into it, and the draft flag
    # cleared last - so a failed upload leaves the release behind as a draft with
    # nothing attached. Re-running the job completes it. A draft release that outlives
    # a run is the sign of an upload that failed rather than something in progress.
    - name: Create release and attach build
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.vars.outputs.sha_short }}
        name: Holos 4 - ${{ steps.vars.outputs.sha_short }}
        files: ${{ inputs.filename }}.zip
        draft: false
        prerelease: false
